# ============================================================
# nginx access.log 格式 · 公安备案「日志留存」字段用
# ============================================================
#
# 放哪
# ----
# 这段属于**全局** http 段（不是 server 段），写进 /etc/nginx/nginx.conf：
#
#   http {
#       # ↓↓↓ 把下面这行加在这里（与其它 log_format 同级）↓↓↓
#       log_format  main  '$remote_addr:$remote_port - $remote_user [$time_local] "$request" '
#                         '$status $body_bytes_sent "$http_referer" '
#                         '"$http_user_agent" "$http_x_forwarded_for" '
#                         'host="$host" server_addr="$server_addr" '
#                         'rt=$request_time urt="$upstream_response_time"';
#       ...
#   }
#
# 为什么是这几个字段（对着安全评估的日志字段清单）
# ----------------------------------------------
#   $remote_addr:$remote_port  → 网络源地址 + 网络源端口
#   $time_local                → 操作时间
#   $request                   → 操作类型（方法 + 路径）
#   $http_user_agent           → 客户端软硬件特征
#   $http_x_forwarded_for      → 真实来源链
#   $host                      → 目标地址（目标域名）
#   $server_addr               → 目标服务器地址
#   $request_time              → 请求耗时
#
# ⚠️ 默认的 main 格式**没有源端口、也没有目标地址**（2026-11-18 实测），
#    备案要这两个字段，必须显式加。
#
# 改完必须：nginx -t && systemctl reload nginx
#
# ⚠️ 访问日志只知道「哪个 IP 访问了哪个 URL」，**不知道访问的是哪个登录用户** ——
#    用户账号那一维由应用层的 audit_logs 表补齐（backend/app/services/audit.py）。
# ============================================================
