# nginx 反代 · teacher-question-bank
# 装到: /etc/nginx/conf.d/teacherbank.conf
#
# 架构(同源):
#   https://tqb.lanhu-lab.top/       → nginx 直接托管 Vue 静态文件 /opt/teacher-bank/web
#   https://tqb.lanhu-lab.top/api/   → nginx 反代 127.0.0.1:8000
#
# 为什么同源:
#   1. 前端用相对路径 /api,不用管域名
#   2. 不用配 CORS
#   3. 以后加登录/cookie 也简单

upstream teacherbank_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name tqb.lanhu-lab.top;

    # 上传大小 —— 跟后端 MAX_FILE_SIZE(10MB) 一致,留点余量
    client_max_body_size 12M;

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # === API 反代 ===
    location /api/ {
        proxy_pass http://teacherbank_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDF 导出要启 Chromium,可能 30 秒+
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 关掉缓冲,大响应流式出
        proxy_buffering off;
    }

    # === 上传的图片(静态) ===
    location /uploads/ {
        proxy_pass http://teacherbank_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # === 前端静态文件 ===
    location / {
        root /opt/teacher-bank/web;
        index index.html;

        # Vue Router history 模式:找不到文件就回 index.html
        try_files $uri $uri/ /index.html;

        # 带 hash 的静态资源可以长缓存
        location ~* \.(js|css|woff2?|ttf|png|jpg|svg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}

# HTTPS 配置由 certbot 自动补
# 签完证书后 nginx 里会有 listen 443 的 server 块
