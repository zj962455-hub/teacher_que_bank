# nginx 反代 · teacher-question-bank
# 装到: /etc/nginx/conf.d/teacherbank.conf
#
# 架构(同源):
#   https://tqb.lanhu-lab.top/       → nginx 直接托管 Vue 静态文件 /opt/teacher-bank/web
#   https://tqb.lanhu-lab.top/api/   → nginx 反代 127.0.0.1:8000
#
# 为什么同源:
#   1. 前端用相对路径 /api,不用管域名
#   2. 不用配 CORS
#   3. 以后加登录/cookie 也简单
#
# ⚠️ 2026-11-05 lesson-11 安全收口:
#   - 恢复 certbot 生成的 443 块(之前被误删,reload 会断 HTTPS)
#   - 加安全响应头
#   - 上传目录禁执行 + 敏感文件拒绝

upstream teacherbank_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ============================================================
# HTTPS(443)—— 主入口
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name tqb.lanhu-lab.top 8.160.177.222;

    ssl_certificate /etc/letsencrypt/live/tqb.lanhu-lab.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tqb.lanhu-lab.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 不暴露 nginx 版本号
    server_tokens off;

    # === lesson-11 安全响应头 ===
# ⚠️ nginx 的 add_header 不跨层级叠加 ——
#    location 里只要有一条 add_header，server 层的就全部失效。
#    所以这里做成片段，在 server 块和所有自带 add_header 的 location 里都 include。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # === HSTS（仅 HTTPS）===
# 浏览器只认 HTTPS 收到的 HSTS，所以这个片段只在 443 块里 include。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


    # 上传大小 —— 跟后端 MAX_FILE_SIZE(10MB) 一致,留点余量
    client_max_body_size 12M;

    # === 上传目录:禁执行、禁直连 ===
    # ⚠️ 上传的文件本来就走带鉴权的 /api/uploads/ 后端路由(校验 token + 归属)。
    #    这里再加一道:任何 /uploads/ 直连一律 404 —— 杜绝「拿到文件名就下载」。
    location ^~ /uploads/ {
        return 404;
    }

    # === 敏感文件:一律拒绝 ===
    # .env / .git / .sql / .bak 之类,一个都不给。
    # (?!) 是负向先行断言 —— 排除 /.well-known/(证书验证要用)。
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(sql|bak|conf|ini|log|sh|py)$ {
        deny all;
    }

    # ⚠️ 上面那条 /\.(?!well-known) 只挡得住 /.env 这种「点开头」的,
    #    挡不住 /app.env(点不在开头)—— 两种都要挡。
    location ~* \.env$ {
        deny all;
    }

    # === API 反代 ===
    location /api/ {
        proxy_pass http://teacherbank_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDF 导出要启 Chromium,可能 30 秒+
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 关掉缓冲,大响应流式出
        proxy_buffering off;

        # === lesson-11 安全响应头 ===
# ⚠️ nginx 的 add_header 不跨层级叠加 ——
#    location 里只要有一条 add_header，server 层的就全部失效。
#    所以这里做成片段，在 server 块和所有自带 add_header 的 location 里都 include。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # === HSTS（仅 HTTPS）===
# 浏览器只认 HTTPS 收到的 HSTS，所以这个片段只在 443 块里 include。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    }

    # === 上传的图片（带鉴权）===
    location /api/uploads/ {
        proxy_pass http://teacherbank_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "private" always;
        # === lesson-11 安全响应头 ===
# ⚠️ nginx 的 add_header 不跨层级叠加 ——
#    location 里只要有一条 add_header，server 层的就全部失效。
#    所以这里做成片段，在 server 块和所有自带 add_header 的 location 里都 include。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # === HSTS（仅 HTTPS）===
# 浏览器只认 HTTPS 收到的 HSTS，所以这个片段只在 443 块里 include。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    }

    # === 前端静态文件 ===
    location / {
        root /opt/teacher-bank/web;
        index index.html;

        # Vue Router history 模式:找不到文件就回 index.html
        try_files $uri $uri/ /index.html;

        # 带 hash 的静态资源可以长缓存
        location ~* \.(js|css|woff2?|ttf|png|jpg|svg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable" always;
            # === lesson-11 安全响应头 ===
# ⚠️ nginx 的 add_header 不跨层级叠加 ——
#    location 里只要有一条 add_header，server 层的就全部失效。
#    所以这里做成片段，在 server 块和所有自带 add_header 的 location 里都 include。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

            # === HSTS（仅 HTTPS）===
# 浏览器只认 HTTPS 收到的 HSTS，所以这个片段只在 443 块里 include。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        }
    }
}

# ============================================================
# HTTP(80)
#
# 域名访问 → 跳 HTTPS
# IP 直连 → 保留 HTTP(备案期间的备用入口,也是运维排查通道)
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # ⚠️ 不写 `_` —— nginx.conf 里那个默认块也声明了 `_`，
    #    两个同名会报 "conflicting server name" 警告。
    #    去掉不影响 IP 直连(8.160.177.222 在 server_name 里显式写了),
    #    也仍然是 default_server → 任何 Host 都落在这个块。
    server_name tqb.lanhu-lab.top 8.160.177.222;

    server_tokens off;

    # === lesson-11 安全响应头 ===
# ⚠️ nginx 的 add_header 不跨层级叠加 ——
#    location 里只要有一条 add_header，server 层的就全部失效。
#    所以这里做成片段，在 server 块和所有自带 add_header 的 location 里都 include。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;


    client_max_body_size 12M;

    # 域名访问强制走 HTTPS
    # IP 直连(8.160.177.222)不跳 —— 留个 HTTP 通道,方便排查。
    if ($host = "tqb.lanhu-lab.top") {
        return 301 https://$host$request_uri;
    }

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 上传目录禁执行
    location ^~ /uploads/ {
        return 404;
    }

    # 敏感文件拒绝
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(sql|bak|conf|ini|log|sh|py)$ {
        deny all;
    }

    # ⚠️ 上面那条 /\.(?!well-known) 只挡得住 /.env 这种「点开头」的,
    #    挡不住 /app.env(点不在开头)—— 两种都要挡。
    location ~* \.env$ {
        deny all;
    }

    location /api/ {
        proxy_pass http://teacherbank_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        # === lesson-11 安全响应头 ===
# ⚠️ nginx 的 add_header 不跨层级叠加 ——
#    location 里只要有一条 add_header，server 层的就全部失效。
#    所以这里做成片段，在 server 块和所有自带 add_header 的 location 里都 include。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    }

    location /api/uploads/ {
        proxy_pass http://teacherbank_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "private" always;
        # === lesson-11 安全响应头 ===
# ⚠️ nginx 的 add_header 不跨层级叠加 ——
#    location 里只要有一条 add_header，server 层的就全部失效。
#    所以这里做成片段，在 server 块和所有自带 add_header 的 location 里都 include。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    }

    location / {
        root /opt/teacher-bank/web;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|woff2?|ttf|png|jpg|svg|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable" always;
            # === lesson-11 安全响应头 ===
# ⚠️ nginx 的 add_header 不跨层级叠加 ——
#    location 里只要有一条 add_header，server 层的就全部失效。
#    所以这里做成片段，在 server 块和所有自带 add_header 的 location 里都 include。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        }
    }
}
