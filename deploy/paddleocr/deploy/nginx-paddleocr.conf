# nginx 反代 · paddleocr-api
# 装完后 01-install.sh 第 7 步会自动调 certbot 签 HTTPS
# 手动跑:sudo certbot --nginx -d <DOMAIN>

# 上传大小(client_max_body_size)和 app 一致(10MB)
upstream paddleocr_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP 服务(http 用于 certbot 验证 + 反代到后端)
# server_name 会由 01-install.sh sed 替换为 $DOMAIN(默认 lanhu-lab.top)
server {
    listen 80;
    listen [::]:80;
    server_name lanhu-lab.top;

    client_max_body_size 10M;

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 健康检查不走鉴权
    location /api/v1/health {
        proxy_pass http://paddleocr_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OCR 接口
    location /api/v1/ {
        proxy_pass http://paddleocr_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置:OCR 单图最多 30 秒
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 关掉缓冲,流式拿到结果
        proxy_buffering off;
    }

    # 其他路径拒绝
    location / {
        return 404 "Not Found";
    }
}

# HTTPS 配置(certbot 跑完后会自动加一段 server { listen 443 ... })
# 这里留个模板占位